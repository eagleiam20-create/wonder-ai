
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STREET SYNDICATE — Lite</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:white}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:12px;background:#101820dc;padding:12px 15px;border:1px solid #ffffff25;border-radius:10px;pointer-events:none}
#hud b{color:#7de8ff;letter-spacing:1px}
#stats{font-size:12px;color:#c6d6df;margin-top:6px}
#help{position:fixed;top:12px;right:12px;background:#101820c9;padding:10px;border-radius:8px;font-size:12px;color:#d6e3eb}
#controls{position:fixed;bottom:18px;left:16px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px}
.ctrl{border:1px solid #ffffff40;border-radius:12px;background:#172b3dcc;color:white;font-size:22px;touch-action:none;user-select:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#101820ee;padding:18px;border-radius:12px;max-width:85%;text-align:center;display:none}
#look{position:fixed;right:0;bottom:0;width:48%;height:55%;touch-action:none}
@media(pointer:fine){#controls{display:none}#look{display:none}}
</style>
</head>
<body>
<div id="hud">
  <b>STREET SYNDICATE</b>
  <div style="font-size:11px;margin-top:4px">CITY EXPLORER · LITE EDITION</div>
  <div id="stats">Preparing city...</div>
</div>
<div id="help">WASD / Arrow keys: Move<br>Shift: Run<br>Drag mouse: Look around</div>
<div id="controls">
  <button class="ctrl" id="up">▲</button>
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="down">▼</button>
  <button class="ctrl" id="right">▶</button>
</div>
<div id="look"></div>
<div id="message"></div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const stats = document.getElementById('stats');
const message = document.getElementById('message');

try {
startGame();
} catch (err) {
showError(err);
}

function showError(err) {
 console.error(err);
 message.style.display = 'block';
 message.textContent = 'Game could not start. Check your internet connection and reload. Details: ' + err.message;
}

function startGame() {
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc8df);
scene.fog = new THREE.Fog(0x9bc8df, 220, 620);

const camera = new THREE.PerspectiveCamera(
65, window.innerWidth/window.innerHeight, 0.1, 750
);

const renderer = new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:'low-power',
 alpha:false,
 stencil:false,
 depth:true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.15));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

// Low-cost lighting: deliberately no real-time shadows.
scene.add(new THREE.HemisphereLight(0xe3f5ff, 0x505b65, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.set(-100,180,80);
scene.add(sun);

const mat = (color, roughness=1) =>
 new THREE.MeshStandardMaterial({color, roughness, metalness:0});

const groundMat = mat(0x777e80);
const roadMat = mat(0x30363b);
const pavementMat = mat(0xa6aaab);
const lineMat = new THREE.MeshBasicMaterial({color:0xe9dfac});
const whiteMat = new THREE.MeshBasicMaterial({color:0xe3e7e8});

function box(w,h,d,material,x,y,z) {
 const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

// One ground, plus a small number of long road meshes.
box(900,1,900,groundMat,0,-0.55,0);

for(let i=-4;i<=4;i++){
 const p=i*100;
 box(18,0.08,900,roadMat,p,-0.025,0);
 box(900,0.08,18,roadMat,0,-0.02,p);

 // Continuous central road markings keep draw calls low.
 box(0.20,0.025,900,lineMat,p,-0.005,0);
 box(900,0.025,0.20,lineMat,0,0.002,p);

 // Sidewalks along the road edges.
 for(const side of [-1,1]){
   box(3,0.16,900,pavementMat,p+side*11,-0.01,0);
   box(900,0.16,3,pavementMat,0,-0.005,p+side*11);
 }
}

// Procedural window texture: one shared texture, not hundreds of meshes.
const canvas = document.createElement('canvas');
canvas.width=64;
canvas.height=64;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#344653';
ctx.fillRect(0,0,64,64);
for(let y=5;y<64;y+=12){
 for(let x=5;x<64;x+=11){
  ctx.fillStyle = ((x+y)%4===0) ? '#9dd8e5' : '#587c91';
  ctx.fillRect(x,y,6,7);
 }
}
const facade = new THREE.CanvasTexture(canvas);
facade.colorSpace=THREE.SRGBColorSpace;
facade.magFilter=THREE.NearestFilter;
facade.minFilter=THREE.LinearMipmapLinearFilter;

const buildingMaterial = new THREE.MeshStandardMaterial({
 map:facade, roughness:0.9, metalness:0.03
});

// Instancing lets the city contain many buildings with very few draw calls.
const maxBuildings=850;
const buildingGeo=new THREE.BoxGeometry(1,1,1);
const buildings=new THREE.InstancedMesh(
 buildingGeo, buildingMaterial, maxBuildings
);
buildings.instanceMatrix.setUsage(THREE.StaticDrawUsage);

const dummy=new THREE.Object3D();
const palette=[
 new THREE.Color(0x8b9da5),
 new THREE.Color(0xb3aaa0),
 new THREE.Color(0x657e8e),
 new THREE.Color(0xc0c5c5),
 new THREE.Color(0x798c9a),
 new THREE.Color(0xa49b8d)
];

let count=0;
let seed=20261010;
function rand(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

for(let x=-400;x<=400;x+=25){
 for(let z=-400;z<=400;z+=25){
  // Leave generous room for roads and intersections.
  const roadX=Math.abs(x%100);
  const roadZ=Math.abs(z%100);
  if(roadX<19 || roadZ<19) continue;
  if(count>=maxBuildings) break;

  const w=12+rand()*7;
  const d=12+rand()*7;
  let h=10+rand()*38;

  // Taller towers near the central business district.
  if(Math.abs(x)<140 && Math.abs(z)<140) h+=rand()*35;
  h=Math.min(h,85);

  dummy.position.set(x+(rand()-.5)*5,h/2,z+(rand()-.5)*5);
  dummy.scale.set(w,h,d);
  dummy.rotation.set(0,0,0);
  dummy.updateMatrix();
  buildings.setMatrixAt(count,dummy.matrix);
  buildings.setColorAt(count,palette[Math.floor(rand()*palette.length)]);
  count++;
 }
}
buildings.count=count;
buildings.computeBoundingSphere();
scene.add(buildings);

// A few simple landmarks, made from a small number of meshes.
const glassMat=mat(0x477f9a,0.25);
box(24,110,24,glassMat,-65,55,-65);
box(28,2,28,mat(0x303d48),-65,111,-65);
box(18,3,18,mat(0xb4d9e7),-65,113.5,-65);

const parkMat=mat(0x477a4d);
box(70,0.3,70,parkMat,210,0,210);
const treeMat=mat(0x2c6944);
const trunkMat=mat(0x6d5038);
const trunkGeo=new THREE.CylinderGeometry(0.45,0.6,3,5);
const crownGeo=new THREE.IcosahedronGeometry(2.2,0);
const trunkMesh=new THREE.InstancedMesh(trunkGeo,trunkMat,45);
const crownMesh=new THREE.InstancedMesh(crownGeo,treeMat,45);
let treeCount=0;
for(let x=180;x<240;x+=9){
 for(let z=180;z<240;z+=9){
  if(treeCount>=45) break;
  dummy.position.set(x,1.5,z);
  dummy.scale.setScalar(1);
  dummy.updateMatrix();
  trunkMesh.setMatrixAt(treeCount,dummy.matrix);
  dummy.position.set(x,4.1,z);
  dummy.scale.setScalar(1+rand()*0.45);
  dummy.updateMatrix();
  crownMesh.setMatrixAt(treeCount,dummy.matrix);
  treeCount++;
 }
}
trunkMesh.count=treeCount;
crownMesh.count=treeCount;
scene.add(trunkMesh,crownMesh);

// Player: simple capsule-like shape.
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.CylinderGeometry(0.65,0.72,2.0,7),
 mat(0x292d45)
);
body.position.y=1.25;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.48,8,6),
 mat(0xd5a17d)
);
head.position.y=2.55;
player.add(head);
scene.add(player);
player.position.set(0,0,0);

// A limited number of lightweight traffic cars.
const cars=[];
const carColors=[0xd9dfe1,0x326d9a,0x9b3936,0x252b30,0xd1a64e,0x477b57];
for(let i=0;i<8;i++){
 const car=new THREE.Group();
 const color=mat(carColors[i%carColors.length]);
 const chassis=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.1,5.3),color);
 chassis.position.y=0.8;
 car.add(chassis);
 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(2.35,0.85,2.5),
  mat(0x7695a3,0.65)
 );
 cabin.position.set(0,1.65,-0.2);
 car.add(cabin);
 scene.add(car);
 car.position.set(-390+i*95,0,-100);
 cars.push({mesh:car,axis:i%2,speed:7+i%4,offset:i*95});
}

// Input
const keys={};
window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

let yaw=0;
let pitch=0.20;
let dragging=false;
let lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw-=(e.clientX-lastX)*0.004;
 pitch=Math.max(-0.15,Math.min(0.65,pitch+(e.clientY-lastY)*0.003));
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

// Mobile camera swipe
const look=document.getElementById('look');
let touchLook=false,tx=0,ty=0;
look.addEventListener('pointerdown',e=>{
 touchLook=true;tx=e.clientX;ty=e.clientY;
 look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove',e=>{
 if(!touchLook)return;
 yaw-=(e.clientX-tx)*0.006;
 pitch=Math.max(-0.15,Math.min(0.65,pitch+(e.clientY-ty)*0.004));
 tx=e.clientX;ty=e.clientY;
});
look.addEventListener('pointerup',()=>touchLook=false);
look.addEventListener('pointercancel',()=>touchLook=false);

// Touch buttons hold movement while pressed.
function bindButton(id,key){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[key]=true;};
 const up=e=>{e.preventDefault();keys[key]=false;};
 el.addEventListener('pointerdown',down);
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
 el.addEventListener('lostpointercapture',up);
}
bindButton('up','w');
bindButton('down','s');
bindButton('left','a');
bindButton('right','d');

const clock=new THREE.Clock();
let elapsed=0;
let frames=0,fps=0,fpsTime=0;
const target=new THREE.Vector3();
const desiredCamera=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 if(document.hidden)return;

 // Avoid huge simulation jumps after a pause or lag spike.
 const dt=Math.min(clock.getDelta(),0.04);
 elapsed+=dt;

 let forward=0,side=0;
 if(keys.w||keys.arrowup)forward+=1;
 if(keys.s||keys.arrowdown)forward-=1;
 if(keys.d||keys.arrowright)side+=1;
 if(keys.a||keys.arrowleft)side-=1;

 const moving=forward!==0||side!==0;
 const speed=(keys.shift?23:13)*dt;
 if(moving){
  const len=Math.hypot(forward,side)||1;
  forward/=len;side/=len;
  player.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;
  player.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed;
  player.rotation.y=yaw+Math.atan2(side,forward);
 }

 // Keep the player within the city.
 player.position.x=THREE.MathUtils.clamp(player.position.x,-430,430);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-430,430);

 // Traffic moves on straight roads; deliberately no physics simulation.
 for(const c of cars){
  if(c.axis===0){
   c.mesh.position.x+=c.speed*dt;
   if(c.mesh.position.x>440)c.mesh.position.x=-440;
   c.mesh.position.z=-100+Math.floor(c.offset/95)*100;
   c.mesh.rotation.y=Math.PI/2;
  }else{
   c.mesh.position.z+=c.speed*dt;
   if(c.mesh.position.z>440)c.mesh.position.z=-440;
   c.mesh.position.x=100+Math.floor(c.offset/95)*100;
   c.mesh.rotation.y=0;
  }
 }

 // Third-person camera
 const distance=12;
 desiredCamera.set(
  player.position.x+Math.sin(yaw)*Math.cos(pitch)*distance,
  player.position.y+5.5+Math.sin(pitch)*distance,
  player.position.z+Math.cos(yaw)*Math.cos(pitch)*distance
 );
 camera.position.lerp(desiredCamera,Math.min(1,dt*5));
 target.set(player.position.x,player.position.y+1.7,player.position.z);
 camera.lookAt(target);

 frames++;fpsTime+=dt;
 if(fpsTime>=1){
  fps=frames/fpsTime;frames=0;fpsTime=0;
  stats.textContent=
   'District: '+district(player.position.x,player.position.z)+
   ' · FPS: '+Math.round(fps)+
   ' · Buildings: '+count;
 }
 renderer.render(scene,camera);
}

function district(x,z){
 if(Math.abs(x)<140&&Math.abs(z)<140)return 'Downtown';
 if(x>150&&z>150)return 'City Park';
 if(Math.abs(x)>300||Math.abs(z)>300)return 'Outskirts';
 return 'Urban District';
}

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.15));
 renderer.setSize(window.innerWidth,window.innerHeight);
});

camera.position.set(0,7,15);
camera.lookAt(0,1,0);
animate();
}
</script>
</body>
</html>
