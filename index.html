
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STREET SYNDICATE — World 001</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#9bbbd0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
#logo{position:absolute;top:18px;left:18px;font-weight:900;font-size:20px;letter-spacing:2px;text-shadow:0 2px 8px #000}
#logo span{display:block;font-size:10px;color:#8ce8ff;letter-spacing:4px;margin-top:5px}
#info{position:absolute;right:18px;top:18px;text-align:right;font-size:12px;line-height:1.8;text-shadow:0 2px 8px #000}
#help{position:absolute;bottom:18px;left:18px;background:#071522cc;border:1px solid #ffffff40;border-radius:10px;padding:12px;font-size:12px;line-height:1.8}
#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(130deg,#06111df5,#173b50e8)}
.panel{width:min(500px,90vw);padding:28px;border:1px solid #8ce8ff70;border-radius:18px;background:#091927ee;color:white}
h1{font-size:clamp(28px,7vw,46px);margin:0;letter-spacing:2px}
h1 b{color:#8ce8ff}
p{color:#c9d9e4;line-height:1.6}
button{border:0;border-radius:9px;padding:14px 20px;background:#8ce8ff;color:#071522;font-weight:900;cursor:pointer}
#play{width:100%}
#mobile{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}
#stick{position:absolute;left:24px;bottom:28px;width:110px;height:110px;border:2px solid #ffffff70;border-radius:50%;background:#07152266;pointer-events:auto;touch-action:none}
#nub{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:#8ce8ffcc;border:2px solid white}
#look{position:absolute;right:0;top:15%;width:48%;height:60%;pointer-events:auto;touch-action:none}
@media(pointer:coarse){#mobile{display:block}#help{display:none}}
</style>
</head>
<body>
<div id="start">
  <div class="panel">
    <h1>STREET <b>SYNDICATE</b></h1>
    <p>WORLD 001 — GLOBAL CITY</p>
    <p>A new open-world foundation. Explore the ground, roads and city space from a third-person camera.</p>
    <button id="play">ENTER WORLD</button>
    <p id="status">Preparing the world...</p>
  </div>
</div>

<div id="hud">
  <div id="logo">STREET SYNDICATE<span>GLOBAL CITY PROJECT</span></div>
  <div id="info">WORLD: 1,200 × 1,200<br>LOCATION: <b id="position">0, 0</b></div>
  <div id="help">W A S D — MOVE<br>SHIFT — RUN<br>DRAG MOUSE — LOOK</div>
</div>

<div id="mobile">
  <div id="stick"><div id="nub"></div></div>
  <div id="look"></div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// 1. SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bbbd0);
scene.fog = new THREE.Fog(0x9bbbd0, 180, 950);

// 2. CAMERA
const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 1500
);

// 3. RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance"
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// 4. LIGHTING
scene.add(new THREE.HemisphereLight(0xe5f5ff, 0x52604d, 2));

const sun = new THREE.DirectionalLight(0xffe5bc, 2);
sun.position.set(-200, 350, 150);
scene.add(sun);

// 5. MATERIALS
const grass = new THREE.MeshStandardMaterial({color:0x657b64});
const asphalt = new THREE.MeshStandardMaterial({color:0x303740});
const concrete = new THREE.MeshStandardMaterial({color:0xb9bcb8});
const roadLine = new THREE.MeshBasicMaterial({color:0xe3dfb6});

// 6. HELPER FUNCTIONS
function addPlane(width, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth), material
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
}

function addBox(width, height, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth), material
  );
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
}

// 7. WORLD GROUND
addPlane(1200, 1200, grass, 0, -0.1, 0);

// 8. CONNECTED ROAD GRID
for (let p = -550; p <= 550; p += 50) {
  // Horizontal and vertical roads
  addPlane(1200, 15, asphalt, 0, 0, p);
  addPlane(15, 1200, asphalt, p, 0.01, 0);

  // Sidewalk strips
  addPlane(1200, 2, concrete, 0, 0.02, p + 9);
  addPlane(1200, 2, concrete, 0, 0.02, p - 9);
  addPlane(2, 1200, concrete, p + 9, 0.02, 0);
  addPlane(2, 1200, concrete, p - 9, 0.02, 0);

  // Dashed lane markings
  for (let t = -570; t <= 570; t += 24) {
    addPlane(6, 0.22, roadLine, t, 0.025, p);
    addPlane(0.22, 6, roadLine, p, 0.026, t);
  }
}

// 9. PLAYER
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.48, 0.75, 3, 7),
  new THREE.MeshStandardMaterial({color:0x284d78})
);
body.position.y = 1.25;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 10, 8),
  new THREE.MeshStandardMaterial({color:0xc99572})
);
head.position.y = 2.2;
player.add(head);

const legs = new THREE.Mesh(
  new THREE.BoxGeometry(0.65, 0.65, 0.4),
  new THREE.MeshStandardMaterial({color:0x20262e})
);
legs.position.y = 0.4;
player.add(legs);

player.position.set(0, 0, 15);
scene.add(player);

// 10. MOVEMENT AND CAMERA
const keys = {};
let yaw = 0;
let pitch = 0.18;
let started = false;

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});
addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});
addEventListener("blur", () => {
  for (const key in keys) keys[key] = false;
});

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button === 0) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
});

addEventListener("pointerup", () => dragging = false);

addEventListener("pointermove", e => {
  if (!dragging || !started) return;
  yaw -= (e.clientX - lastX) * 0.004;
  pitch = THREE.MathUtils.clamp(
    pitch + (e.clientY - lastY) * 0.003, -0.2, 0.8
  );
  lastX = e.clientX;
  lastY = e.clientY;
});

// 11. MOBILE JOYSTICK
let joyX = 0;
let joyY = 0;
let joyId = null;

const stick = document.getElementById("stick");
const nub = document.getElementById("nub");

function updateJoystick(e) {
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const distance = Math.hypot(dx, dy);
  if (distance > 32) {
    dx = dx / distance * 32;
    dy = dy / distance * 32;
  }
  joyX = dx / 32;
  joyY = dy / 32;
  nub.style.transform = `translate(${dx}px,${dy}px)`;
}

function resetJoystick() {
  joyId = null;
  joyX = 0;
  joyY = 0;
  nub.style.transform = "translate(0,0)";
}

stick.addEventListener("pointerdown", e => {
  joyId = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});
stick.addEventListener("pointermove", e => {
  if (e.pointerId === joyId) updateJoystick(e);
});
stick.addEventListener("pointerup", resetJoystick);
stick.addEventListener("pointercancel", resetJoystick);

// Mobile camera swipe
const look = document.getElementById("look");
let lookId = null;
let lookX = 0;
let lookY = 0;

look.addEventListener("pointerdown", e => {
  lookId = e.pointerId;
  lookX = e.clientX;
  lookY = e.clientY;
  look.setPointerCapture(e.pointerId);
});
look.addEventListener("pointermove", e => {
  if (e.pointerId !== lookId) return;
  yaw -= (e.clientX - lookX) * 0.008;
  pitch = THREE.MathUtils.clamp(
    pitch + (e.clientY - lookY) * 0.006, -0.2, 0.8
  );
  lookX = e.clientX;
  lookY = e.clientY;
});
look.addEventListener("pointerup", () => lookId = null);
look.addEventListener("pointercancel", () => lookId = null);

// 12. ENTER WORLD
document.getElementById("play").addEventListener("click", () => {
  started = true;
  document.getElementById("start").style.display = "none";
});

// 13. GAME LOOP
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);

  if (started) {
    let forward =
      (keys["w"] || keys["arrowup"] ? 1 : 0) -
      (keys["s"] || keys["arrowdown"] ? 1 : 0) - joyY;

    let side =
      (keys["d"] || keys["arrowright"] ? 1 : 0) -
      (keys["a"] || keys["arrowleft"] ? 1 : 0) + joyX;

    const length = Math.hypot(forward, side);
    if (length > 1) {
      forward /= length;
      side /= length;
    }

    const speed = keys["shift"] ? 16 : 8;
    const dx = (Math.sin(yaw) * forward +
                Math.cos(yaw) * side) * speed * dt;
    const dz = (Math.cos(yaw) * forward -
                Math.sin(yaw) * side) * speed * dt;

    player.position.x = THREE.MathUtils.clamp(
      player.position.x + dx, -590, 590
    );
    player.position.z = THREE.MathUtils.clamp(
      player.position.z + dz, -590, 590
    );

    if (Math.abs(forward) + Math.abs(side) > 0.1) {
      player.rotation.y = Math.atan2(dx, dz);
      legs.rotation.x = Math.sin(performance.now() * 0.012) * 0.12;
    } else {
      legs.rotation.x = 0;
    }

    document.getElementById("position").textContent =
      `${Math.round(player.position.x)}, ${Math.round(player.position.z)}`;

    const target = new THREE.Vector3(
      player.position.x, player.position.y + 1.8, player.position.z
    );

    const distance = 7.5;
    camera.position.set(
      target.x + Math.sin(yaw) * Math.cos(pitch) * distance,
      target.y + 2.5 + Math.sin(pitch) * distance,
      target.z + Math.cos(yaw) * Math.cos(pitch) * distance
    );
    camera.lookAt(target);
  }

  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});

document.getElementById("status").textContent =
  "World ready. Click ENTER WORLD to begin.";

animate();
</script>
</body>
</html>
