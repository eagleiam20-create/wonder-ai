
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Syndicate</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#10151c;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101820df;border:1px solid #ffffff25;border-radius:12px;padding:12px}
#brand{position:absolute;top:14px;left:14px}
#brand b{font-size:20px;letter-spacing:2px;color:#70f5c4}
#stats{position:absolute;top:14px;right:14px;text-align:right}
#help{position:absolute;bottom:14px;left:14px;font-size:13px;line-height:1.8}
#connect{position:absolute;top:105px;right:14px;width:230px;pointer-events:auto}
input,button{width:100%;padding:10px;margin-top:6px;border-radius:7px;border:1px solid #43515c;background:#17232d;color:white}
button{background:#70f5c4;color:#102019;font-weight:bold;cursor:pointer}
#message{position:absolute;top:44%;width:100%;text-align:center;font-size:20px;font-weight:bold;text-shadow:0 2px 8px black}
#mobile{position:absolute;bottom:18px;right:15px;display:none;pointer-events:auto;gap:8px}
#mobile button{width:58px;height:55px;font-size:20px}
@media(max-width:700px){#mobile{display:flex;flex-wrap:wrap;width:190px}#help{font-size:11px}#connect{top:105px;width:165px}#brand b{font-size:15px}}
</style>
</head>
<body>
<div id="hud">
 <div id="brand" class="panel"><b>STREET SYNDICATE</b><div>OPEN CITY // PROTOTYPE</div></div>
 <div id="stats" class="panel">CREDITS: <b id="score">0</b><br>PLAYERS: <b id="players">1</b><br><span id="status">SOLO MODE</span></div>
 <div id="connect" class="panel">
  <b>ONLINE CITY</b>
  <input id="playerName" maxlength="16" placeholder="Your nickname" value="StreetRider">
  <input id="room" maxlength="20" placeholder="Room code" value="city01">
  <input id="projectUrl" placeholder="Supabase project URL">
  <input id="projectKey" placeholder="Supabase publishable key">
  <button id="join">JOIN ONLINE</button>
  <div style="font-size:11px;margin-top:7px;color:#c4d0d8">Friends must use the same room code and project.</div>
 </div>
 <div id="help" class="panel">WASD / ARROWS — MOVE<br>E — ENTER / EXIT CAR<br>COLLECT THE GLOWING CHECKPOINTS<br>ESC — RELEASE MOVEMENT KEYS</div>
 <div id="message">EXPLORE THE CITY</div>
 <div id="mobile">
  <button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button id="enterCar">E</button>
 </div>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbac9);
scene.fog=new THREE.Fog(0x9bbac9,55,145);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff,0x536047,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,35,15);scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x63805c));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const roadMat=mat(0x303943),lineMat=mat(0xe6d89c);
for(let p=-80;p<=80;p+=20){
 const rx=new THREE.Mesh(new THREE.BoxGeometry(180,.06,8),roadMat);
 rx.position.set(0,.04,p);scene.add(rx);
 const rz=new THREE.Mesh(new THREE.BoxGeometry(8,.06,180),roadMat);
 rz.position.set(p,.04,0);scene.add(rz);
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(180,.025,.12),lineMat);
 stripe.position.set(0,.08,p);scene.add(stripe);
}

for(let x=-70;x<=70;x+=20){
 for(let z=-70;z<=70;z+=20){
  if(Math.abs(x)<12&&Math.abs(z)<12)continue;
  const h=5+Math.random()*17;
  const b=new THREE.Mesh(new THREE.BoxGeometry(8,h,8),
   mat([0x788895,0xb1a18b,0x647b88,0x8c8e9b][Math.floor(Math.random()*4)]));
  b.position.set(x+(Math.random()-.5)*3,h/2,z+(Math.random()-.5)*3);
  scene.add(b);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(8.2,.35,8.2),mat(0x394752));
  roof.position.set(b.position.x,h+.12,b.position.z);scene.add(roof);
 }
}

function makeCar(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2, .8, 3.5),mat(color));
 body.position.y=.65;g.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.45,.65,1.65),mat(0x263947));
 cabin.position.set(0,1.3,-.15);g.add(cabin);
 for(const x of [-.95,.95])for(const z of [-1.1,1.1]){
  const w=new THREE.Mesh(new THREE.BoxGeometry(.22,.5,.6),mat(0x171a20));
  w.position.set(x,.38,z);g.add(w);
 }
 scene.add(g);return g;
}

const player=new THREE.Group();
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.75,3,6),mat(0x28cda1));
torso.position.y=1;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),mat(0xf0c6a1));
head.position.y=1.85;player.add(head);
scene.add(player);

const car=makeCar(0xf2a33a);
player.position.set(0,0,0);car.position.set(4,0,0);
let driving=false,score=0;
const keys={};
const remotes=new Map();
const id=crypto.randomUUID();
let channel=null,supabase=null;
const $=id=>document.getElementById(id);
const message=t=>{$("message").textContent=t};
function updatePlayers(){$("players").textContent=1+remotes.size}

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 keys[k]=true;
 if(k==="e"&&!e.repeat)toggleCar();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));
$("enterCar").onclick=toggleCar;
function toggleCar(){
 if(!driving&&player.position.distanceTo(car.position)<4){
  driving=true;player.visible=false;message("VEHICLE ACQUIRED");
 }else if(driving){
  driving=false;player.visible=true;
  player.position.copy(car.position).add(new THREE.Vector3(2,0,0));
  message("BACK ON THE STREET");
 }
}

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("pointerdown",down);
 b.addEventListener("pointerup",up);
 b.addEventListener("pointerleave",up);
 b.addEventListener("pointercancel",up);
});

const tokens=[];
for(let i=0;i<8;i++){
 const orb=new THREE.Mesh(new THREE.OctahedronGeometry(.8),new THREE.MeshStandardMaterial({
  color:0x70f5c4,emissive:0x148f70,emissiveIntensity:1.5
 }));
 orb.position.set((Math.floor(Math.random()*7)-3)*20,1.5,(Math.floor(Math.random()*7)-3)*20);
 scene.add(orb);tokens.push(orb);
}
function collect(){
 const pos=driving?car.position:player.position;
 for(const t of tokens){
  if(t.visible&&pos.distanceTo(t.position)<3){
   t.visible=false;score+=100;$("score").textContent=score;
   message("+100 CREDITS");
   setTimeout(()=>{t.position.set((Math.random()-.5)*130,1.5,(Math.random()-.5)*130);t.visible=true},2500);
  }
 }
}

function remotePlayer(pid,name,color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.8,3,6),mat(color));
 body.position.y=1;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),mat(0xf0c6a1));
 head.position.y=1.85;g.add(head);
 scene.add(g);return g;
}

$("join").onclick=async()=>{
 const url=$("projectUrl").value.trim(),key=$("projectKey").value.trim();
 const room=$("room").value.trim().replace(/[^a-zA-Z0-9_-]/g,"").slice(0,20);
 if(!url||!key||!room){message("ADD SUPABASE DETAILS + ROOM");return}
 try{
  if(channel){await supabase.removeChannel(channel);channel=null}
  remotes.forEach(r=>scene.remove(r.mesh));remotes.clear();updatePlayers();
  supabase=createClient(url,key);
  channel=supabase.channel("street-syndicate-"+room,{config:{broadcast:{self:false}}});
  channel.on("broadcast",{event:"state"},({payload:p})=>{
   if(!p||p.id===id||typeof p.x!=="number"||typeof p.z!=="number")return;
   let r=remotes.get(p.id);
   if(!r){
    const mesh=remotePlayer(p.id,p.name,0x8d82ff);
    r={mesh,last:Date.now()};remotes.set(p.id,r);
   }
   r.mesh.position.set(p.x,0,p.z);
   r.mesh.rotation.y=p.rot||0;
   r.last=Date.now();updatePlayers();
  });
  channel.subscribe(status=>{
   if(status==="SUBSCRIBED"){
    $("status").textContent="ONLINE: "+room;
    message("YOU'RE IN THE CITY");
   }else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
    $("status").textContent="CONNECTION ERROR";
    message("CHECK SUPABASE SETTINGS");
   }
  });
 }catch(err){message("CONNECTION FAILED");console.error(err)}
};

let lastSend=0,last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 const target=driving?car:player;
 if(forward||side){
  const speed=driving?13:7;
  const v=new THREE.Vector3(side,0,-forward).normalize().multiplyScalar(speed*dt);
  target.position.add(v);
  target.position.x=THREE.MathUtils.clamp(target.position.x,-85,85);
  target.position.z=THREE.MathUtils.clamp(target.position.z,-85,85);
  target.rotation.y=Math.atan2(v.x,v.z);
  if(driving)player.position.copy(car.position);
 }
 if(driving)player.position.copy(car.position);
 collect();
 for(const [pid,r] of remotes){
  if(now-r.last>12000){scene.remove(r.mesh);remotes.delete(pid);updatePlayers()}
 }
 const follow=driving?car:player;
 const desired=new THREE.Vector3(follow.position.x,8,follow.position.z+12);
 camera.position.lerp(desired,.09);
 camera.lookAt(follow.position.x,1,follow.position.z);
 tokens.forEach((t,i)=>{if(t.visible){t.rotation.y+=dt*1.4;t.position.y=1.5+Math.sin(now*.002+i)*.25}});
 if(channel&&now-lastSend>120){
  lastSend=now;
  channel.send({type:"broadcast",event:"state",payload:{
   id,name:$("playerName").value.slice(0,16)||"Rider",
   x:follow.position.x,z:follow.position.z,rot:follow.rotation.y
  }}).catch(()=>{});
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
